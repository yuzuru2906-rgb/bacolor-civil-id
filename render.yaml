# Render "Blueprint": lets you deploy by clicking New > Blueprint and pointing at your GitHub repo.
services:
  - type: web
    name: bacolor-civil-id
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        sync: false        # paste your Neon connection string in the Render dashboard
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false        # choose a strong password in the Render dashboard
      - key: ADMIN_SIGNUP_CODE
        sync: false        # secret code for new staff (leave empty in the dashboard to disable)
      - key: AUTO_VERIFY
        value: "true"
